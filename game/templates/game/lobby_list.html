{% extends "base.html" %}
{% block title %}Lobbies — Fools Arena{% endblock %}
{% block content %}
<section>
  <h2>Open lobbies</h2>
  <p id="lobby-status">Loading…</p>
  <ul id="lobby-list"></ul>
</section>
<section>
  <h3>Create lobby</h3>
  <form id="create-form">
    <label>Name <input name="name" required maxlength="100" /></label>
    <label><input type="checkbox" name="is_private" /> Private</label>
    <label>Password <input name="password" type="password" autocomplete="new-password" /></label>
    <label>Max players <input name="max_players" type="number" min="2" max="8" value="4" /></label>
    <label>Deck
      <select name="card_count">
        <option value="24">24</option>
        <option value="36" selected>36</option>
        <option value="52">52</option>
      </select>
    </label>
    <label><input type="checkbox" name="neighbor_throw_only" /> Neighbor throw only</label>
    <label><input type="checkbox" name="is_transferable" /> Transferable</label>
    <button type="submit">Create</button>
  </form>
  <p id="create-error" style="color:crimson"></p>
</section>
<script>
(function () {
  const API = "/api/game/lobbies/";
  function csrf() {
    const m = document.cookie.match(/csrftoken=([^;]+)/);
    return m ? decodeURIComponent(m[1]) : "";
  }
  async function api(method, url, body) {
    const opts = { method, credentials: "same-origin", headers: {} };
    if (body !== undefined) {
      opts.headers["Content-Type"] = "application/json";
      opts.headers["X-CSRFToken"] = csrf();
      opts.body = JSON.stringify(body);
    }
    const r = await fetch(url, opts);
    const t = await r.text();
    let data;
    try { data = t ? JSON.parse(t) : null; } catch (_) { data = t; }
    if (!r.ok) throw new Error((data && data.detail) || r.statusText || String(r.status));
    return data;
  }
  function renderList(rows) {
    const ul = document.getElementById("lobby-list");
    ul.innerHTML = "";
    rows.forEach(function (L) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = "/game/lobbies/" + L.id + "/";
      a.textContent = L.name + " (" + L.players.length + "/" + L.settings.max_players + ")";
      li.appendChild(a);
      ul.appendChild(li);
    });
    document.getElementById("lobby-status").textContent = rows.length ? "" : "No public lobbies.";
  }
  async function refresh() {
    try {
      const rows = await api("GET", API);
      renderList(rows);
    } catch (e) {
      document.getElementById("lobby-status").textContent = "Could not load lobbies: " + e.message;
    }
  }
  document.getElementById("create-form").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    document.getElementById("create-error").textContent = "";
    const f = ev.target;
    const body = {
      name: f.name.value.trim(),
      is_private: f.is_private.checked,
      password: f.password.value || "",
      max_players: Number(f.max_players.value),
      card_count: Number(f.card_count.value),
      neighbor_throw_only: f.neighbor_throw_only.checked,
      is_transferable: f.is_transferable.checked,
      allow_jokers: false
    };
    try {
      const L = await api("POST", API, body);
      location.href = "/game/lobbies/" + L.id + "/";
    } catch (e) {
      document.getElementById("create-error").textContent = e.message;
    }
  });
  refresh();
})();
</script>
{% endblock %}
